<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Merci pour votre engagement</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >

  <link rel="stylesheet" href="style.css">

  <style>
    .page-merci {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 20px;
    }

    .carte-merci {
      width: 100%;
      max-width: 650px;
      padding: 55px 35px;
      border: 1px solid #e8dcc5;
      border-radius: 25px;
      background: white;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .icone-merci {
      width: 85px;
      height: 85px;
      display: grid;
      place-items: center;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: var(--gold);
      color: white;
      font-size: 2.5rem;
    }

    .carte-merci h1 {
      color: var(--gold);
      font-size: clamp(3rem, 8vw, 4.7rem);
    }

    .carte-merci p {
      color: var(--text-light);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .amen {
      margin-top: 22px;
      color: var(--gold) !important;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.7rem !important;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="page-merci">

    <section class="carte-merci">

      <div class="icone-merci">
        <i class="bi bi-check-lg"></i>
      </div>

      <p class="petit-titre">Votre engagement est enregistré</p>

      <h1>Hazak</h1>

      <div class="separateur">
        <span></span>
        <i class="bi bi-flower1"></i>
        <span></span>
      </div>

      <p>
        Que cette mitsva soit un grand mérite léïlouy nichmat Mme Azogui.
      </p>

      <p class="amen">Amen.</p>

      <a href="index.html" class="btn btn-gold">
        Retour à l'accueil
      </a>

    </section>

  </main>

</body>

</html>
